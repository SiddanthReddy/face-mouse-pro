[project]
name = "face-mouse-pro"
version = "1.0.0"
description = "Production-Grade Hands-Free Cursor & Gesture Control System Powered by Real-Time AI & Computer Vision."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".pytest_cache",
    ".mypy_cache",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
]
ignore = [
    "E501",  # line length
    "E402",  # module import not at top of file (sys.path manipulation in scripts)
    "B008",  # function call in argument defaults
    "B905",  # zip strict
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = false
ignore_missing_imports = true
exclude = [
    "build",
    "dist",
    "venv",
]
