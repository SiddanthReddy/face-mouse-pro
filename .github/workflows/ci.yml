name: Face Mouse Pro — CI Quality & Build Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: Code Quality (Ruff & MyPy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting & Typing Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff Linting
        run: |
          ruff check .

      - name: Run Ruff Format Check
        run: |
          ruff format --check .

      - name: Run MyPy Type Checking
        run: |
          mypy src/ tests/

  test:
    name: PyTest Automated Test Matrix
    needs: lint-and-typecheck
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PyTest Suite
        run: |
          pytest tests/ -v --durations=10

      - name: Run Benchmarks
        run: |
          python src/utils/benchmark.py

  build-executable:
    name: Standalone Windows PyInstaller Build
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pre-Flight Validation & PyInstaller Build
        run: |
          python build_executable.py

      - name: Upload Standalone Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceMousePro-Windows-x64
          path: dist/FaceMousePro/
          retention-days: 14
