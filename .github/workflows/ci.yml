name: Face Mouse Pro — CI Quality & Build Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: Code Quality (Ruff & MyPy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout Shared Core
        uses: actions/checkout@v4
        with:
          repository: SiddanthReddy/face-mouse-pro-core
          ref: 7ae514e29578f09a819ae4f5bb84218049e338e5
          path: face-mouse-pro-core

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting & Typing Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Run Ruff Linting
        run: |
          ruff check src/ tests/ main.py build_executable.py

      - name: Run Ruff Format Check
        run: |
          ruff format --check src/ tests/ main.py build_executable.py

      - name: Run MyPy Type Checking
        run: |
          mypy src/ tests/

  test:
    name: PyTest Automated Test Matrix
    needs: lint-and-typecheck
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout Shared Core
        uses: actions/checkout@v4
        with:
          repository: SiddanthReddy/face-mouse-pro-core
          ref: 7ae514e29578f09a819ae4f5bb84218049e338e5
          path: face-mouse-pro-core

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PyTest Suite
        run: |
          pytest tests/ -v --durations=10
          pytest face-mouse-pro-core/tests/ -v

      - name: Run Benchmarks
        run: |
          python src/utils/benchmark.py

  build-executable:
    name: Standalone Windows PyInstaller Build
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout Shared Core
        uses: actions/checkout@v4
        with:
          repository: SiddanthReddy/face-mouse-pro-core
          ref: 7ae514e29578f09a819ae4f5bb84218049e338e5
          path: face-mouse-pro-core

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pre-Flight Validation & PyInstaller Build
        run: |
          python build_executable.py

      - name: Upload Standalone Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceMousePro-Windows-x64
          path: dist/FaceMousePro/
          retention-days: 14

  windows-opencv-validation:
    name: Windows OpenCV Dependency Validation
    runs-on: windows-latest
    steps:
      - name: Checkout Windows Application
        uses: actions/checkout@v4

      - name: Checkout Shared Core
        uses: actions/checkout@v4
        with:
          repository: SiddanthReddy/face-mouse-pro-core
          ref: 7ae514e29578f09a819ae4f5bb84218049e338e5
          path: face-mouse-pro-core

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create temporary validation requirements
        shell: pwsh
        run: |
          $lines = Get-Content requirements.txt | Where-Object {
            $_ -notmatch '^\s*opencv-python(?:[<=>!~;\[]|\s|$)' -and
            $_ -notmatch '^\s*numpy(?:[<=>!~;\[]|\s|$)'
          }
          $lines += "opencv-contrib-python==4.8.1.78"
          $lines += "numpy==1.26.4"
          $validationRequirements = Join-Path $env:RUNNER_TEMP "requirements-windows-validation.txt"
          Set-Content -Path $validationRequirements -Value $lines -Encoding utf8NoBOM

          if (-not (Test-Path $validationRequirements)) {
            throw "Temporary validation requirements file was not created."
          }
          $contents = Get-Content $validationRequirements
          $expected = @(
            "mediapipe==0.10.9",
            "opencv-contrib-python==4.8.1.78",
            "numpy==1.26.4",
            "face-mouse-pro-core @ git+https://github.com/SiddanthReddy/face-mouse-pro-core.git@7ae514e29578f09a819ae4f5bb84218049e338e5"
          )
          foreach ($entry in $expected) {
            if ($contents -notcontains $entry) {
              throw "Temporary validation requirements are missing: $entry"
            }
          }
          if ($contents -match '^\s*opencv-python(?:-headless)?(?:[<=>!~;\[]|\s|$)' -or
              $contents -match '^\s*opencv-contrib-python-headless(?:[<=>!~;\[]|\s|$)') {
            throw "Temporary validation requirements contain a conflicting OpenCV distribution."
          }
          Write-Host "Verified temporary requirements at $validationRequirements"

      - name: Install validation dependencies
        shell: pwsh
        run: |
          $validationRequirements = Join-Path $env:RUNNER_TEMP "requirements-windows-validation.txt"
          python -m pip install -r $validationRequirements

      - name: Print installed dependency versions
        run: python -m pip freeze

      - name: Verify OpenCV distributions and imports
        shell: pwsh
        run: |
          python -c "import importlib.metadata as m; names={d.metadata['Name'].lower() for d in m.distributions()}; opencv=names & {'opencv-python','opencv-python-headless','opencv-contrib-python','opencv-contrib-python-headless'}; assert opencv == {'opencv-contrib-python'}, f'Unexpected OpenCV distributions: {opencv}'; assert m.version('opencv-contrib-python') == '4.8.1.78'; assert m.version('numpy') == '1.26.4'; print('OpenCV distributions:', opencv, 'NumPy:', m.version('numpy'))"
          python -c "import cv2, mediapipe, numpy, face_mouse_core; assert cv2.__version__.startswith('4.8.1'), cv2.__version__; assert mediapipe.__version__ == '0.10.9'; assert numpy.__version__ == '1.26.4'; print(f'cv2={cv2.__version__}, mediapipe={mediapipe.__version__}, numpy={numpy.__version__}, core={face_mouse_core.__file__}')"
          python -c "import json; from importlib.metadata import distribution; d=distribution('face-mouse-pro-core'); info=json.loads(d.read_text('direct_url.json')); expected='7ae514e29578f09a819ae4f5bb84218049e338e5'; assert d.version == '0.1.0'; assert info['vcs_info']['commit_id'] == expected, info; print(f'face-mouse-pro-core=={d.version} at {expected}')"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run shared core tests
        run: python -m pytest face-mouse-pro-core/tests/ -v

      - name: Run hardware-independent Windows adapter tests
        run: python -m pytest tests/test_core_adapters.py tests/test_core_mouse_adapter.py -v
